<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スピーキングカードのイラスト確認（開発用）</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f2ff; margin: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  figure { margin: 0; background: #fff; border-radius: 14px; padding: 10px; box-shadow: 0 4px 14px -8px rgba(40, 20, 120, .4); }
  figcaption { font-size: 13px; margin-top: 6px; }
  svg { width: 100%; height: auto; display: block; border-radius: 8px; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script type="module">
  import { CARDS } from '../data/speaking.js';
  document.getElementById('g').innerHTML = CARDS.map((c) => `<figure>${c.scene()}<figcaption><b>${c.title}</b> — No.3: ${c.q3.q} → ${c.q3.a}</figcaption></figure>`).join('');
</script>
</body>
</html>
